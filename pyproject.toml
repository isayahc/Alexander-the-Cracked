[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alexander-the-cracked"
version = "0.1.0"
description = "An agent that searches for hackathons and competitions then builds project codebases for them"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "click>=8.1",
    "claude-agent-sdk>=0.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
alexander = "alexander.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/alexander"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests", "builds/paypal-ai-hackathon"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
